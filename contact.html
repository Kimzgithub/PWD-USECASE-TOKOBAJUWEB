<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — ABYSSAL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body data-page="contact"><main class="px"><h1 class="ttl">Contact</h1>
<div class="split"><div><form id="f" novalidate>
<div class="fg"><label class="lb" for="n">Nama</label><input id="n" class="f" required autocomplete="name"></div>
<div class="fg"><label class="lb" for="e">Email</label><input id="e" class="f" type="email" required autocomplete="email"></div>
<div class="fg"><label class="lb" for="s">Subjek</label><select id="s" class="f"><option>Pertanyaan Umum</option><option>Status Pesanan</option><option>Kerja Sama</option><option>Lainnya</option></select></div>
<div class="fg"><label class="lb" for="m">Pesan</label><textarea id="m" class="f" required></textarea></div>
<button class="btn-r" type="submit">KIRIM PESAN</button><p class="ok" id="ok" role="status">Pesan terkirim. Kami membalas dalam 1–2 hari kerja.</p></form></div>
<div><span class="lb">TEMUKAN KAMI DI</span><div class="soc"><a href="#" aria-label="Facebook"><i data-lucide="facebook"></i></a><a href="#" aria-label="Twitter"><i data-lucide="twitter"></i></a><a href="#" aria-label="Instagram"><i data-lucide="instagram"></i></a><a href="#" aria-label="YouTube"><i data-lucide="youtube"></i></a><a href="#" aria-label="Twitch"><i data-lucide="twitch"></i></a><a href="#" aria-label="Musik"><i data-lucide="music"></i></a><a href="#" aria-label="WhatsApp"><i data-lucide="message-circle"></i></a></div></div></div></main>
<script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<script>
lucide.createIcons();
document.getElementById('f').onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.checkValidity()){f.reportValidity();return}f.reset();document.getElementById('ok').classList.add('show')};
</script></body></html>
