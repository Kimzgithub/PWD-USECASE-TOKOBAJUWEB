<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shop — ABYSSAL</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body data-page="store">
    <main class="px">
      <h1 class="ttl">Shop</h1>
      <div class="row">
        <aside class="col-lg-2">
          <div class="side">
            <div class="srch">
              <i data-lucide="search"></i
              ><input
                id="q"
                class="f"
                placeholder="Cari produk"
                aria-label="Cari produk"
              />
            </div>
            <div class="cats" id="cats"></div>
          </div>
        </aside>
        <section class="col-lg-10">
          <div class="row g-4" id="grid"></div>
        </section>
      </div>
    </main>
    <script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js"></script>
    <script src="app.js"></script>
    <script>
      const P = [
        [1, "Auskar", 129000, "Aksesoris", "gem"],
        [2, "Skelebiner AB", 99000, "Aksesoris", "link"],
        [3, "Skelebiner AS", 99000, "Aksesoris", "link"],
        [4, "Skelebiner SC", 99000, "Aksesoris", "link"],
        [5, "Sarung Tangan Rajut", 149000, "Aksesoris", "hand"],
        [6, "Kalung Tali", 79000, "Aksesoris", "paperclip"],
        [7, "Celana Kargo Hitam", 399000, "Pakaian", "layers"],
        [8, "Kemeja Flanel Hitam", 359000, "Pakaian", "shirt"],
        [9, "Hoodie Void", 429000, "Pakaian", "flame"],
        [10, "Kaos Penumbra", 199000, "Kaos", "shirt"],
        [11, "Kaos Ritual", 219000, "Kaos", "skull"],
        [12, "Kaos Abyssal Logo", 189000, "Kaos", "moon"],
      ].map((a) => ({
        id: a[0],
        name: a[1],
        price: a[2],
        cat: a[3],
        icon: a[4],
      }));
      let cat = "Semua";
      const g = document.getElementById("grid"),
        q = document.getElementById("q"),
        C = document.getElementById("cats");
      const rp = (n) => "Rp " + n.toLocaleString("id-ID");
      function draw() {
        const k = q.value.toLowerCase();
        g.innerHTML =
          P.filter(
            (p) =>
              (cat == "Semua" || p.cat == cat) &&
              p.name.toLowerCase().includes(k),
          )
            .map(
              (p) =>
                `<div class="col-6 col-md-4 col-xl-3"><article class="pc"><div class="tile"><i data-lucide="${p.icon}"></i></div><div class="nm">${p.name}</div><div class="pr mono">${rp(p.price)}</div><button class="btn-r" data-id="${p.id}">TAMBAH KE KERANJANG</button></article></div>`,
            )
            .join("") ||
          '<p class="text-secondary">Produk tidak ditemukan.</p>';
        lucide.createIcons();
      }
      C.innerHTML = ["Semua", "Aksesoris", "Pakaian", "Kaos"]
        .map((c) => `<button class="${c == cat ? "on" : ""}">${c}</button>`)
        .join("");
      C.onclick = (e) => {
        if (e.target.tagName != "BUTTON") return;
        cat = e.target.textContent;
        C.querySelectorAll("button").forEach((b) =>
          b.classList.toggle("on", b == e.target),
        );
        draw();
      };
      q.oninput = draw;
      g.onclick = (e) => {
        const b = e.target.closest("[data-id]");
        if (b)
          Cart.add(
            P.find((p) => p.id == b.dataset.id),
            b,
          );
      };
      draw();
    </script>
  </body>
</html>
